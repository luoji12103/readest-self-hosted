name: Build Selfhost

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to package, without a leading v. Defaults to apps/readest-app/package.json.
        required: false
        type: string
  workflow_call:
    inputs:
      release_version:
        description: Version to package, without a leading v.
        required: false
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      TAURI_UPDATER_PUBKEY:
        required: true
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

env:
  SELFHOST_PRODUCT_NAME: Readest SH
  SELFHOST_APP_IDENTIFIER: com.readest.selfhost
  # Public certificate digest already deployed in the selfhost-v0.11.2 APKs.
  SELFHOST_ANDROID_CERT_SHA256: 903bf29bdf76ec24766e48eb8eafc0f0d228572be347008956b3f6aa63d753be
  TAURI_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
  SELFHOST_RELEASE_VERSION: ${{ inputs.release_version }}
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize git submodules
        run: git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply release version override
        if: env.SELFHOST_RELEASE_VERSION != ''
        shell: bash
        run: |
          set -euo pipefail
          cd apps/readest-app
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.SELFHOST_RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid release version: ${version}`);
          }
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Setup app vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: windows-selfhost-${{ matrix.config.arch }}-cargo

      - name: Validate signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_UPDATER_PUBKEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is required"
              exit 1
            fi
          done

      - name: Build Windows installer and portable binary
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.config.rust_target }}
          ASSET_ARCH: ${{ matrix.config.arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          pnpm patch-tauri-selfhost
          pnpm tauri build --target "$RUST_TARGET" --bundles nsis

          version=$(node -p "require('./package.json').version")
          output_dir=dist/selfhost/windows
          mkdir -p "$output_dir"
          target_roots=()
          for target_root in ../../target src-tauri/target; do
            if [ -d "$target_root" ]; then
              target_roots+=("$target_root")
            fi
          done
          mapfile -t installers < <(find "${target_roots[@]}" -path "*/${RUST_TARGET}/release/bundle/nsis/*.exe" -type f | sort)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected one Windows ${ASSET_ARCH} NSIS installer, found ${#installers[@]}"
            printf '%s\n' "${installers[@]:-}"
            exit 1
          fi
          installer="${installers[0]}"
          case "$ASSET_ARCH" in
            x64)
              setup_asset="${output_dir}/Readest-Selfhost_${version}_x64-setup.exe"
              portable_asset="${output_dir}/Readest-Selfhost_${version}_x64-portable.exe"
              ;;
            arm64)
              setup_asset="${output_dir}/Readest-Selfhost_${version}_arm64-setup.exe"
              portable_asset="${output_dir}/Readest-Selfhost_${version}_arm64-portable.exe"
              ;;
            *)
              echo "::error::Unsupported Windows asset architecture: ${ASSET_ARCH}"
              exit 1
              ;;
          esac
          cp "$installer" "$setup_asset"
          if [ -s "${installer}.sig" ]; then
            cp "${installer}.sig" "${setup_asset}.sig"
          else
            pnpm tauri signer sign "$setup_asset"
          fi

          printf 'NEXT_PUBLIC_PORTABLE_APP=true\n' >> .env.local
          pnpm tauri build --target "$RUST_TARGET" --bundles nsis
          mapfile -t binaries < <(find "${target_roots[@]}" -path "*/${RUST_TARGET}/release/readest.exe" -type f | sort)
          if [ "${#binaries[@]}" -ne 1 ]; then
            echo "::error::Expected one Windows ${ASSET_ARCH} portable binary, found ${#binaries[@]}"
            printf '%s\n' "${binaries[@]:-}"
            exit 1
          fi
          cp "${binaries[0]}" "$portable_asset"
          pnpm tauri signer sign "$portable_asset"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selfhost-windows-${{ matrix.config.arch }}
          path: apps/readest-app/dist/selfhost/windows/*
          if-no-files-found: error

  build-linux:
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        config:
          - arch: x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
    env:
      TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize git submodules
        run: git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1 \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1 \
            libjavascriptcoregtk-4.1-dev \
            gir1.2-javascriptcoregtk-4.1 \
            gir1.2-webkit2-4.1 \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply release version override
        if: env.SELFHOST_RELEASE_VERSION != ''
        run: |
          set -euo pipefail
          cd apps/readest-app
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.SELFHOST_RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid release version: ${version}`);
          }
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Setup app vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: linux-selfhost-${{ matrix.config.arch }}-cargo

      - name: Install truly portable AppImage bundler
        env:
          TAURI_APPIMAGE_CLI_REV: 503bdbc1eade37d50a64ea7f81dbe853338b7fda
        run: |
          set -euo pipefail
          tauri_source="$RUNNER_TEMP/tauri-appimage-cli"
          rm -rf "$tauri_source"
          git init -q "$tauri_source"
          git -C "$tauri_source" remote add origin https://github.com/tauri-apps/tauri.git
          git -C "$tauri_source" fetch --depth=1 origin "$TAURI_APPIMAGE_CLI_REV"
          fetched_rev=$(git -C "$tauri_source" rev-parse FETCH_HEAD)
          if [ "$fetched_rev" != "$TAURI_APPIMAGE_CLI_REV" ]; then
            echo "::error::Fetched Tauri AppImage CLI revision ${fetched_rev}, expected ${TAURI_APPIMAGE_CLI_REV}"
            exit 1
          fi
          git -C "$tauri_source" checkout -q --detach FETCH_HEAD

          TAURI_SOURCE="$tauri_source" python3 - <<'PY'
          import os
          from pathlib import Path

          path = (
              Path(os.environ['TAURI_SOURCE'])
              / 'crates/tauri-bundler/src/bundle/linux/appimage/sharun.rs'
          )
          text = path.read_text()
          download_start = '''  let data = download(
          '''
          download_start_replacement = '''  if !quick_sharun.exists() {
              let data = download(
          '''
          download_end = '''  write_and_make_executable(&quick_sharun, data)?;
          '''
          download_end_replacement = '''    write_and_make_executable(&quick_sharun, data)?;
            }
          '''
          if text.count(download_start) != 1 or text.count(download_end) != 1:
              raise SystemExit('Pinned Tauri AppImage helper download block changed unexpectedly')
          text = text.replace(download_start, download_start_replacement)
          text = text.replace(download_end, download_end_replacement)
          path.write_text(text)
          PY

          grep -Fq 'if !quick_sharun.exists()' \
            "$tauri_source/crates/tauri-bundler/src/bundle/linux/appimage/sharun.rs"
          git -C "$tauri_source" diff --check
          cargo install --path "$tauri_source/crates/tauri-cli" --locked --force

      - name: Pin quick-sharun AppImage helper
        run: |
          set -euo pipefail
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$cache_dir"
          curl -fsSL --retry 3 -o "$cache_dir/quick-sharun.sh" \
            "https://github.com/pkgforge-dev/Anylinux-AppImages/raw/b3a9e985cdedf7efa81d172f182cd13983743147/useful-tools/quick-sharun.sh"
          chmod +x "$cache_dir/quick-sharun.sh"

      - name: Validate signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_UPDATER_PUBKEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is required"
              exit 1
            fi
          done

      - name: Build and collect Linux packages
        timeout-minutes: 45
        env:
          ASSET_ARCH: ${{ matrix.config.arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          pnpm patch-tauri-selfhost
          cargo tauri build

          version=$(node -p "require('./package.json').version")
          output_dir=dist/selfhost/linux
          mkdir -p "$output_dir"
          target_roots=()
          for target_root in ../../target src-tauri/target; do
            if [ -d "$target_root" ]; then
              target_roots+=("$target_root")
            fi
          done
          mapfile -t appimages < <(find "${target_roots[@]}" -path '*/release/bundle/appimage/*.AppImage' -type f | sort)
          mapfile -t debs < <(find "${target_roots[@]}" -path '*/release/bundle/deb/*.deb' -type f | sort)
          mapfile -t rpms < <(find "${target_roots[@]}" -path '*/release/bundle/rpm/*.rpm' -type f | sort)
          if [ "${#appimages[@]}" -ne 1 ] || [ "${#debs[@]}" -ne 1 ] || [ "${#rpms[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage, DEB, and RPM for Linux ${ASSET_ARCH}; found ${#appimages[@]}, ${#debs[@]}, ${#rpms[@]}"
            exit 1
          fi

          copy_signed() {
            local source="$1"
            local destination="$2"
            cp "$source" "$destination"
            if [ -s "${source}.sig" ]; then
              cp "${source}.sig" "${destination}.sig"
            else
              pnpm tauri signer sign "$destination"
            fi
          }

          case "$ASSET_ARCH" in
            x64)
              appimage_asset="${output_dir}/Readest-Selfhost_${version}_amd64.AppImage"
              deb_asset="${output_dir}/Readest-Selfhost_${version}_amd64.deb"
              rpm_asset="${output_dir}/Readest-Selfhost-${version}-1.x86_64.rpm"
              ;;
            arm64)
              appimage_asset="${output_dir}/Readest-Selfhost_${version}_aarch64.AppImage"
              deb_asset="${output_dir}/Readest-Selfhost_${version}_arm64.deb"
              rpm_asset="${output_dir}/Readest-Selfhost-${version}-1.aarch64.rpm"
              ;;
            *)
              echo "::error::Unsupported Linux asset architecture: ${ASSET_ARCH}"
              exit 1
              ;;
          esac
          copy_signed "${appimages[0]}" "$appimage_asset"
          copy_signed "${debs[0]}" "$deb_asset"
          copy_signed "${rpms[0]}" "$rpm_asset"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selfhost-linux-${{ matrix.config.arch }}
          path: apps/readest-app/dist/selfhost/linux/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize git submodules
        run: git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply release version override
        if: env.SELFHOST_RELEASE_VERSION != ''
        run: |
          set -euo pipefail
          cd apps/readest-app
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.SELFHOST_RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid release version: ${version}`);
          }
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Setup app vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos-selfhost-universal-cargo

      - name: Validate signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_UPDATER_PUBKEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is required"
              exit 1
            fi
          done

      - name: Build and collect macOS Universal packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          pnpm patch-tauri-selfhost
          pnpm tauri build --target universal-apple-darwin

          version=$(node -p "require('./package.json').version")
          output_dir=dist/selfhost/macos
          mkdir -p "$output_dir"
          target_roots=()
          for target_root in ../../target src-tauri/target; do
            if [ -d "$target_root" ]; then
              target_roots+=("$target_root")
            fi
          done
          dmgs=()
          while IFS= read -r dmg; do
            dmgs+=("$dmg")
          done < <(find "${target_roots[@]}" -path '*/universal-apple-darwin/release/bundle/dmg/*.dmg' -type f | sort)
          updater_archives=()
          while IFS= read -r updater_archive; do
            updater_archives+=("$updater_archive")
          done < <(find "${target_roots[@]}" -path '*/universal-apple-darwin/release/bundle/macos/*.app.tar.gz' -type f | sort)
          if [ "${#dmgs[@]}" -ne 1 ] || [ "${#updater_archives[@]}" -ne 1 ]; then
            echo "::error::Expected one macOS Universal DMG and updater archive; found ${#dmgs[@]} and ${#updater_archives[@]}"
            exit 1
          fi
          dmg_asset="${output_dir}/Readest-Selfhost_${version}_universal.dmg"
          updater_asset="${output_dir}/Readest-Selfhost_${version}_universal.app.tar.gz"
          cp "${dmgs[0]}" "$dmg_asset"
          cp "${updater_archives[0]}" "$updater_asset"
          if [ -s "${updater_archives[0]}.sig" ]; then
            cp "${updater_archives[0]}.sig" "${updater_asset}.sig"
          else
            pnpm tauri signer sign "$updater_asset"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selfhost-macos-universal
          path: apps/readest-app/dist/selfhost/macos/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize git submodules
        run: git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply release version override
        if: env.SELFHOST_RELEASE_VERSION != ''
        run: |
          set -euo pipefail
          cd apps/readest-app
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.SELFHOST_RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid release version: ${version}`);
          }
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Setup app vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: android-selfhost-cargo

      - name: Validate signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            TAURI_UPDATER_PUBKEY \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is required"
              exit 1
            fi
          done

      - name: Initialize signed Android project
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm patch-tauri-selfhost
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png

          pushd src-tauri/gen/android
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          def find_block(source: str, marker: str) -> tuple[int, int, int]:
              start = source.find(marker)
              if start == -1:
                  raise SystemExit(f"Expected Gradle block was not found: {marker}")
              open_brace = source.find("{", start)
              if open_brace == -1:
                  raise SystemExit(f"Expected Gradle block opening brace was not found: {marker}")
              depth = 0
              for index in range(open_brace, len(source)):
                  char = source[index]
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          return start, open_brace, index
              raise SystemExit(f"Expected Gradle block closing brace was not found: {marker}")

          signing_config = '''
                  create("selfhostRelease") {
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH") ?: error("ANDROID_KEYSTORE_PATH is required"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
          '''
          if 'create("selfhostRelease")' not in text:
              if "    signingConfigs {" in text:
                  _, open_brace, _ = find_block(text, "    signingConfigs")
                  text = text[: open_brace + 1] + signing_config + text[open_brace + 1 :]
              else:
                  signing_block = f"    signingConfigs {{{signing_config}    }}\n"
                  build_types_index = text.find("    buildTypes {")
                  if build_types_index == -1:
                      raise SystemExit("Expected Android buildTypes block was not found")
                  text = text[:build_types_index] + signing_block + text[build_types_index:]

          release_assignment = '''
                      signingConfig = signingConfigs.getByName("selfhostRelease")
          '''
          if 'signingConfigs.getByName("selfhostRelease")' not in text:
              _, _, release_close = find_block(text, 'getByName("release")')
              text = text[:release_close] + release_assignment + text[release_close:]

          if 'missingDimensionStrategy("store", "foss")' not in text:
              _, default_config_open, _ = find_block(text, "    defaultConfig")
              dimension_strategy = '''
                  missingDimensionStrategy("store", "foss")
          '''
              text = text[: default_config_open + 1] + dimension_strategy + text[default_config_open + 1 :]

          path.write_text(text)
          PY
          popd

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/readest-selfhost-keystore.jks
        run: |
          set -euo pipefail
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_PATH"

      - name: Build Android universal and split APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/readest-selfhost-keystore.jks
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          version=$(node -p "require('./package.json').version")
          output_dir=dist/selfhost/android
          mkdir -p "$output_dir"

          pnpm tauri android build --apk
          mapfile -t universal_apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*universal*release*.apk' | sort)
          if [ "${#universal_apks[@]}" -ne 1 ]; then
            echo "::error::Expected one Android universal release APK, found ${#universal_apks[@]}"
            printf '%s\n' "${universal_apks[@]:-}"
            exit 1
          fi
          universal_asset="${output_dir}/Readest-Selfhost_${version}_universal.apk"
          cp "${universal_apks[0]}" "$universal_asset"
          mapfile -t universal_abis < <(unzip -Z1 "$universal_asset" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)
          if [ "${universal_abis[*]}" != 'arm64-v8a armeabi-v7a x86 x86_64' ]; then
            echo "::error::Unexpected Android universal ABI set: ${universal_abis[*]:-none}"
            exit 1
          fi

          pnpm tauri android build --split-per-abi --apk
          declare -A abi_to_asset=(
            ["arm64-v8a"]="arm64"
            ["armeabi-v7a"]="armv7"
            ["x86_64"]="x64"
            ["x86"]="x86"
          )
          declare -A found_assets=()
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' | sort)
          for apk in "${apks[@]}"; do
            mapfile -t apk_abis < <(unzip -Z1 "$apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)
            if [ "${#apk_abis[@]}" -ne 1 ]; then
              continue
            fi
            abi="${apk_abis[0]}"
            asset_arch="${abi_to_asset[$abi]:-}"
            if [ -z "$asset_arch" ]; then
              continue
            fi
            if [ -n "${found_assets[$asset_arch]:-}" ]; then
              echo "::error::Duplicate Android APKs for ABI ${abi}"
              exit 1
            fi
            asset="${output_dir}/Readest-Selfhost_${version}_${asset_arch}.apk"
            cp "$apk" "$asset"
            found_assets["$asset_arch"]=1
          done
          for required_asset in arm64 armv7 x64 x86; do
            if [ -z "${found_assets[$required_asset]:-}" ]; then
              echo "::error::Android ${required_asset} release APK was not produced"
              exit 1
            fi
          done

          mapfile -t final_apks < <(find "$output_dir" -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#final_apks[@]}" -ne 5 ]; then
            echo "::error::Expected five final Android APKs, found ${#final_apks[@]}"
            exit 1
          fi

          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [ ! -x "$build_tools/apksigner" ] || [ ! -x "$build_tools/aapt" ]; then
            echo "::error::Android build tools do not provide apksigner and aapt"
            exit 1
          fi
          export PATH="$build_tools:$PATH"
          keystore_certificate_digest=$(
            keytool -exportcert \
              -alias "$ANDROID_KEY_ALIAS" \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null |
              sha256sum |
              awk '{print $1}'
          )
          if [ -z "$keystore_certificate_digest" ]; then
            echo "::error::Unable to derive the Android keystore certificate digest"
            exit 1
          fi
          if [ "$keystore_certificate_digest" != "$SELFHOST_ANDROID_CERT_SHA256" ]; then
            echo "::error::Android keystore certificate does not match the pinned selfhost certificate"
            exit 1
          fi

          for apk in "${final_apks[@]}"; do
            signed_apk="${apk}.signed"
            rm -f "$signed_apk"
            apksigner sign \
              --ks "$ANDROID_KEYSTORE_PATH" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "$signed_apk" \
              "$apk"
            mv "$signed_apk" "$apk"

            verification=$(apksigner verify --verbose --print-certs "$apk")
            certificate_digest=$(
              bash "$GITHUB_WORKSPACE/scripts/extract-android-certificate-sha256.sh" <<< "$verification"
            )
            if [ "$certificate_digest" != "$SELFHOST_ANDROID_CERT_SHA256" ]; then
              echo "::error::Unexpected Android signing certificate for ${apk}: got ${certificate_digest:-missing}, expected ${SELFHOST_ANDROID_CERT_SHA256}"
              exit 1
            fi

            badging=$(aapt dump badging "$apk")
            package_identifier=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$badging")
            package_version=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$badging")
            if [ "$package_identifier" != "$SELFHOST_APP_IDENTIFIER" ]; then
              echo "::error::Unexpected Android package identifier for ${apk}: ${package_identifier}"
              exit 1
            fi
            if [ "$package_version" != "$version" ]; then
              echo "::error::Unexpected Android version for ${apk}: ${package_version}"
              exit 1
            fi

            pnpm tauri signer sign "$apk"
          done

      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selfhost-android-apk
          path: apps/readest-app/dist/selfhost/android/*
          if-no-files-found: error
