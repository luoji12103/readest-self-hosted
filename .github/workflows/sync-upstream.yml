name: Check Stable Upstream Candidate

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: read

concurrency:
  group: sync-stable-upstream-selfhost
  cancel-in-progress: false

jobs:
  sync-stable-selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Prepare stable upstream candidate
        id: candidate
        run: bash scripts/prepare-upstream-candidate.sh https://github.com/readest/readest.git

      - name: Update submodules
        if: steps.candidate.outputs.status == 'ready'
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup pnpm
        if: steps.candidate.outputs.status == 'ready'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node
        if: steps.candidate.outputs.status == 'ready'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust checks
        if: steps.candidate.outputs.status == 'ready'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Install system dependencies
        if: steps.candidate.outputs.status == 'ready'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ripgrep \
            luajit \
            luarocks \
            libsqlite3-dev \
            pkg-config \
            libfontconfig-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install KOReader test dependencies
        if: steps.candidate.outputs.status == 'ready'
        run: |
          sudo luarocks --lua-version=5.1 install busted
          sudo luarocks --lua-version=5.1 install lsqlite3complete

      - name: Install dependencies
        if: steps.candidate.outputs.status == 'ready'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup app vendors
        if: steps.candidate.outputs.status == 'ready'
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Run selfhost policy checks
        if: steps.candidate.outputs.status == 'ready'
        run: |
          bash scripts/test-select-latest-stable-tag.sh
          bash scripts/test-sync-upstream-workflow.sh
          bash scripts/test-prepare-selfhost-release.sh
          bash scripts/test-selfhost-release-workflow.sh
          bash scripts/test-selfhost-android-arm64-workflow.sh
          bash scripts/scan-public-fork-safety.sh
          node --test scripts/test-selfhost-legacy-updater.mjs

      - name: Test selfhost configuration
        if: steps.candidate.outputs.status == 'ready'
        run: |
          pnpm --filter @readest/readest-app test --run \
            src/__tests__/services/customServerConfig.test.ts \
            src/__tests__/services/environment.test.ts \
            src/__tests__/services/selfhostUpdaterConfig.test.ts \
            src/__tests__/helpers/auth.test.ts \
            src/__tests__/helpers/updater.test.ts \
            src/__tests__/services/command-registry-extended.test.ts

      - name: Test KOReader plugin
        if: steps.candidate.outputs.status == 'ready'
        run: pnpm --filter @readest/readest-app test:lua

      - name: Run TypeScript and formatting checks
        if: steps.candidate.outputs.status == 'ready'
        run: |
          pnpm format:check
          pnpm lint

      - name: Run full unit suite
        if: steps.candidate.outputs.status == 'ready'
        run: pnpm --filter @readest/readest-app test --run

      - name: Run Rust checks
        if: steps.candidate.outputs.status == 'ready'
        run: |
          pnpm fmt:check
          pnpm clippy:check

      - name: Build production Web app
        if: steps.candidate.outputs.status == 'ready'
        run: pnpm --filter @readest/readest-app build-web

      - name: Summarize upstream candidate
        if: always()
        env:
          CANDIDATE_STATUS: ${{ steps.candidate.outputs.status }}
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.tree }}
          FORK_BASE: ${{ steps.candidate.outputs.fork_base }}
          UPSTREAM_TAG: ${{ steps.candidate.outputs.upstream_tag }}
          UPSTREAM_COMMIT: ${{ steps.candidate.outputs.upstream_commit }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            printf '## Stable upstream candidate\n\n'
            if [[ -n "$FORK_BASE" ]]; then
              printf -- "- Fork base (\`origin/main\`): \`%s\`\n" "$FORK_BASE"
            fi
            if [[ -n "$UPSTREAM_TAG" ]]; then
              printf -- "- Upstream tag: \`%s\` (\`%s\`)\n" "$UPSTREAM_TAG" "$UPSTREAM_COMMIT"
            fi
            if [[ -n "$CANDIDATE_COMMIT" ]]; then
              printf -- "- Temporary merge commit: \`%s\`\n- Tree: \`%s\`\n" "$CANDIDATE_COMMIT" "$CANDIDATE_TREE"
            fi
            printf '\n'
            case "$CANDIDATE_STATUS:$JOB_STATUS" in
              ready:success)
                echo '**Passed:** the candidate passed validation. Recreate the merge from the recorded commits for review.' ;;
              already-contained:success)
                echo "**Already contained:** the upstream commit is already in \`origin/main\`; no merge or candidate checks were needed." ;;
              conflict:failure)
                echo '**Merge conflict:** no candidate was produced. See the preparation step log for the conflicting paths.' ;;
              ready:failure)
                echo '**Validation failed:** see the failed step before using this candidate.' ;;
              *:cancelled)
                echo '**Cancelled:** the candidate did not complete validation.' ;;
              *)
                echo '**Preparation failed:** see the job log for details.' ;;
            esac
            printf '\nNo remote branch, tag, or release was changed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
