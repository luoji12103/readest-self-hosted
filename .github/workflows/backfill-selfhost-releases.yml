name: Backfill Selfhost Releases

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of missing upstream releases to list.
        required: false
        default: '5'
        type: string
      include_prerelease:
        description: Include upstream prereleases.
        required: false
        default: false
        type: boolean
      oldest_first:
        description: List older missing releases first.
        required: false
        default: true
        type: boolean
      dry_run:
        description: Kept for compatibility. Both values only list tags for manual release.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect missing upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIMIT: ${{ inputs.limit }}
          INCLUDE_PRERELEASE: ${{ inputs.include_prerelease }}
          OLDEST_FIRST: ${{ inputs.oldest_first }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');

          const limit = Number.parseInt(process.env.LIMIT || '5', 10);
          if (!Number.isInteger(limit) || limit < 1 || limit > 20) {
            throw new Error('limit must be an integer between 1 and 20');
          }

          const gh = (args) =>
            cp.execFileSync('gh', args, {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'inherit'],
            });
          const readJson = (args) => JSON.parse(gh(args));
          const includePrerelease = process.env.INCLUDE_PRERELEASE === 'true';
          const oldestFirst = process.env.OLDEST_FIRST === 'true';

          const upstream = readJson([
            'release',
            'list',
            '--repo',
            'readest/readest',
            '--limit',
            '100',
            '--json',
            'tagName,isDraft,isPrerelease,publishedAt',
          ]);
          const existing = new Set(
            readJson([
              'release',
              'list',
              '--repo',
              process.env.GITHUB_REPOSITORY,
              '--limit',
              '100',
              '--json',
              'tagName',
            ]).map((release) => release.tagName),
          );

          const lines = upstream
            .filter((release) => !release.isDraft)
            .filter((release) => includePrerelease || !release.isPrerelease)
            .filter((release) => /^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(release.tagName))
            .filter((release) => !existing.has(`selfhost-${release.tagName}`))
            .sort((a, b) => {
              const left = Date.parse(a.publishedAt || '');
              const right = Date.parse(b.publishedAt || '');
              return oldestFirst ? left - right : right - left;
            })
            .slice(0, limit)
            .map(({ tagName }) => '- `selfhost-' + tagName + '`');

          const summary = [
            '## Missing selfhost releases',
            '',
            'Review the source commit for each tag, then run Release Selfhost manually.',
            '',
            ...(lines.length ? lines : ['No missing releases found.']),
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          NODE
